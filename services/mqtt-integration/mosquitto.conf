persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
# Standard MQTT listener
listener 1883 0.0.0.0
protocol mqtt
# WebSocket listener
listener 9001 0.0.0.0
protocol websockets

# Minimal local-network demo configuration.
# Add authentication and TLS before exposing this broker beyond the trusted LAN.
allow_anonymous true
